services:
    beets-flask:
        image: metasauce/beets-flask:latest
        restart: unless-stopped
        ports:
            - "5001:5001"
        environment:
            # Change to your timezone
            TZ: America/Mexico_City
            PUID: 1000
            PGID: 1000
        volumes:
            - /srv/music-stack/beets-flask-test:/config
            - /home/jp_srv/music-library:/library
            - /mnt/storage/music-data/music/sources:/music/sources
